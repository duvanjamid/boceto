<nav class="navbar">
  <div class="navbar__container">

    <!-- BRAND -->
    <a routerLink="/" class="navbar__brand" (click)="close()">
      <boceto-logo [size]="28"></boceto-logo>
      <span class="navbar__logo-text">Boceto</span>
    </a>

    <!-- DESKTOP LINKS -->
    <div class="navbar__links">
      <a routerLink="/docs"      routerLinkActive="active" [routerLinkActiveOptions]="{exact:true}" class="navbar__link">Componentes</a>
      <a routerLink="/plugins"   routerLinkActive="active" class="navbar__link">Plugins</a>
      <a routerLink="/ai-tools"  routerLinkActive="active" class="navbar__link">AI &amp; MCP</a>
      <a routerLink="/editor"    routerLinkActive="active" class="navbar__link">Editor</a>
      <a routerLink="/license"   routerLinkActive="active" class="navbar__link">Licencia</a>
      <a href="https://www.npmjs.com/package/@duvanjamid/boceto" target="_blank" rel="noopener" class="navbar__link navbar__link--external">npm ↗</a>
      <a href="https://github.com/duvanjamid/boceto" target="_blank" rel="noopener" class="navbar__link navbar__link--external">GitHub ↗</a>
    </div>

    <!-- THEME TOGGLE -->
    <button class="navbar__theme-toggle" (click)="theme.toggle()" [title]="theme.dark() ? 'Modo claro' : 'Modo oscuro'">
      @if (theme.dark()) {
        <i class="fa-solid fa-sun"></i>
      } @else {
        <i class="fa-solid fa-moon"></i>
      }
    </button>

    <!-- HAMBURGER (mobile only) -->
    <button class="navbar__hamburger" (click)="menuOpen.set(!menuOpen())" [attr.aria-label]="menuOpen() ? 'Cerrar menú' : 'Abrir menú'">
      <i [class]="menuOpen() ? 'fa-solid fa-xmark' : 'fa-solid fa-bars'"></i>
    </button>

  </div>
</nav>

<!-- MOBILE MENU -->
@if (menuOpen()) {
  <div class="navbar__overlay" (click)="close()"></div>
  <div class="navbar__mobile-menu">
    <a routerLink="/docs"      class="navbar__mobile-link" (click)="close()"><i class="fa-solid fa-book"></i> Componentes</a>
    <a routerLink="/plugins"   class="navbar__mobile-link" (click)="close()"><i class="fa-solid fa-puzzle-piece"></i> Plugins</a>
    <a routerLink="/ai-tools"  class="navbar__mobile-link" (click)="close()"><i class="fa-solid fa-robot"></i> AI &amp; MCP</a>
    <a routerLink="/editor"    class="navbar__mobile-link" (click)="close()"><i class="fa-solid fa-pen-to-square"></i> Editor</a>
    <a routerLink="/license"   class="navbar__mobile-link" (click)="close()"><i class="fa-solid fa-scale-balanced"></i> Licencia</a>
    <div class="navbar__mobile-sep"></div>
    <a href="https://www.npmjs.com/package/@duvanjamid/boceto" target="_blank" rel="noopener" class="navbar__mobile-link navbar__mobile-link--ext"><i class="fa-brands fa-npm"></i> npm ↗</a>
    <a href="https://github.com/duvanjamid/boceto" target="_blank" rel="noopener" class="navbar__mobile-link navbar__mobile-link--ext"><i class="fa-brands fa-github"></i> GitHub ↗</a>
  </div>
}
